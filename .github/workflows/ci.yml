name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tests do not need debug info, and leaving it out keeps the cache small.
  CARGO_PROFILE_DEV_DEBUG: 0
  # The nightly the dev shell's flake.lock pins. A floating nightly would let a
  # new clippy lint turn CI red with no change to the code.
  RUSTUP_TOOLCHAIN: nightly-2026-06-12

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      # `.cargo/config.toml` links through clang + mold.
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      # The PDK is what a mod links into a wasm guest: prove it still builds there.
      - run: cargo build -p stormlight_mod_sdk --target wasm32-unknown-unknown
