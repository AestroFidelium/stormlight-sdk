[package]
name = "stormlight_mod_sdk"
description = "Guest PDK every mod is authored against — re-exports the ABI, adds host bindings + registration helpers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The guest binding layer must export `mod_register` (`#[unsafe(no_mangle)]`)
# and use the wasm memory bridge, which the workspace-wide `unsafe_code =
# "forbid"` cannot express. Relax to `deny` here only; every unsafe use carries
# an explicit `#[allow(unsafe_code)]` at the FFI shim so it stays auditable.
# Engine + schema crates keep `forbid`.
[lints.rust]
unsafe_code = "deny"

[dependencies]
# Mods depend on THIS, not on schema directly.
stormlight_mod_abi = { path = "../schema" }
serde = { workspace = true }
postcard = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }

[features]
default = []
std = ["stormlight_mod_abi/std", "serde/std", "postcard/use-std"]

[[test]]
name = "property"
path = "tests/property/main.rs"
[[test]]
name = "fuzz"
path = "tests/fuzz/main.rs"
[[test]]
name = "integration"
path = "tests/integration/main.rs"
